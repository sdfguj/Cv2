<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AKMALKHON IBRAGIMOV - SCREENPLAY CV</title>
    <style>
        /* Screenplay Aesthetic CSS */
        @import url('https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap');

        :root {
            --paper-bg: #fdfbf7;
            --text-color: #111111;
            --accent-color: #666666;
            --page-shadow: 0 10px 30px rgba(0,0,0,0.15);
            --font-screenplay: 'Courier Prime', 'Courier New', Courier, monospace;
        }

        [data-theme="dark"] {
            --paper-bg: #121417;
            --text-color: #e2e8f0;
            --accent-color: #94a3b8;
            --page-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #050608;
            color: var(--text-color);
            font-family: var(--font-screenplay);
            display: flex;
            justify-content: center;
            padding: 2rem 1rem 6rem 1rem;
            min-height: 100vh;
        }

        /* Screenplay Page Layout (Emulating standard 8.5x11 page formatting) */
        .page {
            background: var(--paper-bg);
            width: 100%;
            max-width: 800px;
            padding: 4rem 3.5rem;
            box-shadow: var(--page-shadow);
            border-radius: 4px;
            min-height: 1000px;
            position: relative;
            line-height: 1.5;
            font-size: 15px;
        }

        /* Screenplay Title Block (Centered) */
        .title-block {
            text-align: center;
            margin-bottom: 4rem;
            text-transform: uppercase;
        }

        .title-block h1 {
            font-size: 22px;
            letter-spacing: 2px;
            margin-bottom: 1rem;
            font-weight: 700;
        }

        .title-block .credit {
            font-size: 14px;
            color: var(--accent-color);
            margin-bottom: 0.5rem;
        }

        .title-block .author {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 2rem;
        }

        .title-block .meta {
            font-size: 13px;
            color: var(--accent-color);
            border-top: 1px dashed var(--accent-color);
            border-bottom: 1px dashed var(--accent-color);
            padding: 0.75rem 0;
            margin-top: 1rem;
        }

        /* Screenplay Scene Elements */
        .scene-heading {
            text-transform: uppercase;
            font-weight: 700;
            margin-top: 2.5rem;
            margin-bottom: 1rem;
            letter-spacing: 1px;
        }

        .action-text {
            margin-bottom: 1.5rem;
            text-align: justify;
            max-width: 90%;
        }

        /* Character & Dialogue Block (Indented Screenplay Style) */
        .character-block {
            margin: 2rem 0;
        }

        .character-name {
            text-align: center;
            text-transform: uppercase;
            font-weight: 700;
            width: 60%;
            margin: 0 auto 0.25rem auto;
            letter-spacing: 1px;
        }

        .parenthetical {
            text-align: center;
            color: var(--accent-color);
            width: 50%;
            margin: 0 auto 0.5rem auto;
            font-style: italic;
        }

        .dialogue {
            width: 70%;
            margin: 0 auto 1.5rem auto;
            text-align: left;
        }

        .dialogue-list {
            width: 75%;
            margin: 0 auto 1.5rem auto;
            list-style-type: none;
        }

        .dialogue-list li {
            margin-bottom: 0.5rem;
            position: relative;
            padding-left: 1.25rem;
        }

        .dialogue-list li::before {
            content: ">";
            position: absolute;
            left: 0;
            font-weight: bold;
            color: var(--accent-color);
        }

        /* Slug & Timeline Items */
        .timeline-container {
            margin-top: 1.5rem;
        }

        .slug-item {
            margin-bottom: 1.5rem;
        }

        .slug-header {
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 0.25rem;
        }

        .slug-title {
            font-style: italic;
            margin-bottom: 0.25rem;
            color: var(--accent-color);
        }

        .slug-details {
            padding-left: 1.5rem;
            border-left: 2px solid var(--accent-color);
            margin-top: 0.3rem;
        }

        .fade-out {
            text-align: right;
            text-transform: uppercase;
            font-weight: 700;
            margin-top: 4rem;
            letter-spacing: 2px;
        }

        /* Fixed Navigation Controls at Bottom */
        .fixed-controls {
            position: fixed;
            bottom: 1.5rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 1rem;
            background: rgba(18, 20, 23, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 0.6rem 1.2rem;
            border-radius: 30px;
            z-index: 1000;
        }

        .control-btn {
            background: none;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            font-family: var(--font-screenplay);
            padding: 0.4rem 1rem;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s ease;
        }

        .control-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: #ffffff;
        }
    </style>
</head>
<body>

    <!-- Main Screenplay Page Container -->
    <div class="page" id="screenplayContent">
        <div style="text-align: center; padding: 4rem 0;">
            <p>LOADING SCREENPLAY DATA...</p>
        </div>
    </div>

    <!-- Bottom Controls -->
    <div class="fixed-controls">
        <button class="control-btn" id="themeToggleBtn" onclick="toggleTheme()">THEME: DARK</button>
        <button class="control-btn" onclick="window.print()">PRINT SCRIPT</button>
    </div>

    <script>
        const DATA_URL = 'https://raw.githubusercontent.com/sdfguj/cvdata/main/cv_data.json';
        const CACHE_KEY = 'screenplay_cv_cache';

        // Daytime Daylight Theme Detection Function
        function getDaylightTheme() {
            const saved = localStorage.getItem('screenplay_theme');
            if (saved) return saved;

            const hour = new Date().getHours();
            // Daytime: 6:00 AM to 6:00 PM -> Light theme; Night -> Dark theme
            return (hour >= 6 && hour < 18) ? 'light' : 'dark';
        }

        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('screenplay_theme', theme);
            const btn = document.getElementById('themeToggleBtn');
            if (btn) btn.textContent = `THEME: ${theme.toUpperCase()}`;
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme') || 'dark';
            const next = current === 'dark' ? 'light' : 'dark';
            applyTheme(next);
        }

        // Data Fetching & Caching Layer
        async function fetchCVData() {
            // 1. Check in-memory / localStorage cache first
            const cachedData = localStorage.getItem(CACHE_KEY);
            if (cachedData) {
                try {
                    const parsed = JSON.parse(cachedData);
                    renderScreenplay(parsed);
                    // Silently refresh in background
                    refreshCacheInBackground();
                    return;
                } catch (e) {
                    console.warn('Cache parsing failed, fetching fresh data.');
                }
            }

            // 2. Fetch if not cached
            try {
                const res = await fetch(DATA_URL);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                localStorage.setItem(CACHE_KEY, JSON.stringify(data));
                renderScreenplay(data);
            } catch (err) {
                console.error('Error loading JSON data:', err);
                document.getElementById('screenplayContent').innerHTML = `<p style="color:red;">FAILED TO LOAD SCREENPLAY DATA.</p>`;
            }
        }

        async function refreshCacheInBackground() {
            try {
                const res = await fetch(DATA_URL);
                if (res.ok) {
                    const freshData = await res.json();
                    localStorage.setItem(CACHE_KEY, JSON.stringify(freshData));
                }
            } catch (err) {
                // Ignore background fetch errors
            }
        }

        // Render JSON structure into HTML
        function renderScreenplay(data) {
            const container = document.getElementById('screenplayContent');

            let html = `
                <div class="title-block">
                    <h1>${data.title}</h1>
                    <div class="credit">${data.credit}</div>
                    <div class="author">${data.author}</div>
                    <div class="meta">
                        <div>${data.draft_date}</div>
                        <div style="margin-top: 4px;">${data.contact}</div>
                    </div>
                </div>

                <div class="scene-heading">${data.scene_heading}</div>
                <div class="action-text">${data.action}</div>
            `;

            data.sections.forEach(sec => {
                html += `<div class="scene-heading" style="margin-top: 3rem; border-top: 1px solid var(--accent-color); padding-top: 1rem;">${sec.heading}</div>`;

                if (sec.character) {
                    html += `
                        <div class="character-block">
                            <div class="character-name">${sec.character}</div>
                            ${sec.cue_text ? `<div class="parenthetical">${sec.cue_text}</div>` : ''}
                            ${sec.dialogue ? `<div class="dialogue">${sec.dialogue}</div>` : ''}
                        </div>
                    `;
                }

                if (sec.list_items) {
                    html += `<ul class="dialogue-list">`;
                    sec.list_items.forEach(item => {
                        html += `<li>${item}</li>`;
                    });
                    html += `</ul>`;
                }

                if (sec.timeline) {
                    html += `<div class="timeline-container">`;
                    sec.timeline.forEach(item => {
                        html += `
                            <div class="slug-item">
                                <div class="slug-header">${item.slug}</div>
                                <div class="slug-title">${item.title}</div>
                                <div class="slug-details">${item.details}</div>
                            </div>
                        `;
                    });
                    html += `</div>`;
                }
            });

            html += `<div class="fade-out">${data.fade_out}</div>`;

            container.innerHTML = html;
        }

        // Initialize on DOM load
        document.addEventListener('DOMContentLoaded', () => {
            const initialTheme = getDaylightTheme();
            applyTheme(initialTheme);
            fetchCVData();
        });
    </script>
</body>
</html>
